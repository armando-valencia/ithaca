name: CI

on:
  pull_request:
    paths:
      - Ithaca/**
      - .github/workflows/ci.yml
  push:
    paths:
      - Ithaca/**
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: >-
          xcodebuild
          -project Ithaca/Ithaca.xcodeproj
          -scheme Ithaca
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          test
